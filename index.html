<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Al Ain Recovery | 24/7 Roadside Assistance</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#050505;
color:white;
overflow-x:hidden;
}

header{
position:fixed;
top:0;
left:0;
width:100%;
padding:20px 8%;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(0,0,0,.75);
backdrop-filter:blur(10px);
z-index:1000;
}

.logo{
font-size:30px;
font-weight:800;
color:#FFD700;
}

nav a{
color:white;
text-decoration:none;
margin-left:25px;
font-weight:600;
transition:.3s;
}

nav a:hover{
color:#FFD700;
}

.hero{
height:100vh;
background:url("https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=1800&q=80") center/cover;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
position:relative;
}

.hero::before{
content:'';
position:absolute;
inset:0;
background:rgba(0,0,0,.65);
}

.hero-content{
position:relative;
z-index:2;
}

.hero h1{
font-size:60px;
color:#FFD700;
margin-bottom:20px;
}

.hero p{
font-size:22px;
margin-bottom:30px;
}

.btn{
display:inline-block;
padding:15px 35px;
background:#FFD700;
color:black;
text-decoration:none;
font-weight:bold;
border-radius:50px;
transition:.3s;
}

.btn:hover{
transform:scale(1.08);
}

section{
padding:90px 8%;
}

.title{
text-align:center;
font-size:42px;
color:#FFD700;
margin-bottom:50px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
}

.card{
background:#111;
padding:30px;
border-radius:18px;
text-align:center;
transition:.4s;
}

.card:hover{
transform:translateY(-10px);
background:#1b1b1b;
}

.card h3{
margin:15px 0;
color:#FFD700;
}

footer{
background:#000;
padding:40px;
text-align:center;
}

.whatsapp{
position:fixed;
right:25px;
bottom:25px;
background:#25D366;
color:white;
padding:18px;
border-radius:50%;
font-size:28px;
text-decoration:none;
}

</style>

</head>

<body>

<header>

<div class="logo">
🚚 Al Ain Recovery
</div>

<nav>
<a href="#">Home</a>
<a href="#">Services</a>
<a href="#">Gallery</a>
<a href="#">About</a>
<a href="#">Contact</a>
</nav>

</header>

<section class="hero">

<div class="hero-content">

<h1>24/7 Roadside Assistance</h1>

<p>Fast • Professional • Anywhere in Al Ain</p>

<a class="btn" href="tel:+971500000000">
Call Now
</a>

</div>

</section>
